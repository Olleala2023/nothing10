  <title>Distraction-proof 10-Minute Timer - 10 Minutes of Nothing</title>

<body>
  <div id="timer-app" class="timer-app">
    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcome-screen">
      <h1>Distraction-proof 10-Minute Timer</h1>
      <p class="description">Full-screen minimalist timer for your pause session. No distractions, just time.</p>
      
      <div class="sound-toggle">
        <input type="checkbox" id="sound-enabled" checked />
        <label for="sound-enabled">Sound notification when finished</label>
      </div>
      
      <div class="cta-buttons">
        <button class="btn btn-primary" onclick="startTimer()">Start a 10-minute pause</button>
        <a href="/tools/" class="btn">Back to Tools</a>
      </div>
    </div>
    
    <!-- Timer Screen -->
    <div class="timer-screen" id="timer-screen">
      <button class="settings-btn" onclick="resetTimer()">Reset</button>
      <div class="timer-display" id="timer-display">10:00</div>
    </div>
  </div>

  <script>
    let timeLeft = 10 * 60; // 10 minutes in seconds
    let intervalId = null;
    let soundEnabled = true;
    
    document.getElementById('sound-enabled').addEventListener('change', (e) => {
      soundEnabled = e.target.checked;
    });
    
    function startTimer() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('timer-screen').classList.add('active');
      
      // Request fullscreen
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {
          // User denied fullscreen
        });
      }
      
      intervalId = setInterval(() => {
        timeLeft--;
        updateDisplay();
        
        if (timeLeft <= 0) {
          completeTimer();
        }
      }, 1000);
    }
    
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timer-display').textContent = 
        `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }
    
    function completeTimer() {
      clearInterval(intervalId);
      
      // Play soft sound if enabled
      if (soundEnabled) {
        try {
          // Create a soft beep sound using Web Audio API
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          
          oscillator.frequency.value = 800; // Nice soft frequency
          oscillator.type = 'sine';
          
          gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
          
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.5);
        } catch (e) {
          // Web Audio API not available
        }
      }
      
      // Show completion message
      document.getElementById('timer-display').textContent = 'Complete';
      document.getElementById('timer-display').style.opacity = '0.7';
      
      // Auto-reset after 5 seconds
      setTimeout(() => {
        resetTimer();
      }, 5000);
    }
    
    function resetTimer() {
      clearInterval(intervalId);
      timeLeft = 10 * 60;
      document.getElementById('welcome-screen').style.display = 'flex';
      document.getElementById('timer-screen').classList.remove('active');
      document.getElementById('timer-display').style.opacity = '1';
      
      // Exit fullscreen
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  </script>
