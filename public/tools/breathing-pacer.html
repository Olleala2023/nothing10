    <title>Breathing Pacer - Guided Breathing Exercises</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/styles/common.css" />
    <script src="/scripts/theme-toggle.js"></script>

  <body>
    <div class="container">
      <a href="/" class="back-link-mobile">← Home</a>
      <main>
        <h1>Breathing Pacer</h1>
        <p class="subtitle">Choose your breathing pattern for relaxation, focus, or better sleep</p>
      
      <div class="timer-display" id="timerDisplay">
        <span id="timerText">10:00</span>
      </div>
      
      <div class="breathing-container" id="breathingContainer">
        <div class="breathing-barrel" id="breathingBarrel"></div>
        <div class="breathing-text" id="breathingText">Ready</div>
      </div>
      
      <div class="controls">
        <div class="control-group">
          <label>Breathing Patterns</label>
          <div class="pattern-selector">
            <button class="pattern-btn" data-pattern="4-4-4-4">Box (4-4-4-4)</button>
            <button class="pattern-btn active" data-pattern="4.5-0-5.5-0">Resonance</button>
            <button class="pattern-btn" data-pattern="2-0-6-0">Physiological Sigh</button>
            <button class="pattern-btn" data-pattern="4-7-8-0">Sleep/Calm</button>
          </div>
        </div>
      </div>
      
      <div class="cta-buttons">
        <button id="startBtn" class="btn btn-primary">Start Breathing</button>
      </div>
      </main>
      
      <footer class="footer">
        <div class="footer-links">
          <a href="/app">Launch App</a>
          <a href="/focus-lock/">Focus Lock</a>
          <a href="/tools/">Back to Tools</a>
          <a href="/about">About</a>
          <a href="/legal/privacy">Privacy</a>
          <a href="/legal/terms">Terms</a>
          <a href="mailto:contact@nothing10.com">Contact</a>
        </div>
      </footer>
    </div>

    <script>
      const breathingBarrel = document.getElementById('breathingBarrel');
      const breathingText = document.getElementById('breathingText');
      const startBtn = document.getElementById('startBtn');
      const patternBtns = document.querySelectorAll('.pattern-btn');
      const timerDisplay = document.getElementById('timerDisplay');
      const timerText = document.getElementById('timerText');
      
      let isBreathing = false;
      let animationFrame = null;
      let currentPhase = '';
      let selectedPattern = '4.5-0-5.5-0';
      let startTime = 0;
      let timerInterval = null;
      let timeLeft = 10 * 60; // 10 minutes in seconds
      
      const patterns = {
        '4-4-4-4': { inhale: 4, hold1: 4, exhale: 4, hold2: 4, label: 'Box Breathing' },
        '4.5-0-5.5-0': { inhale: 4.5, hold1: 0, exhale: 5.5, hold2: 0, label: 'Resonance Breathing' },
        '2-0-6-0': { inhale: 2, hold1: 0, exhale: 6, hold2: 0, label: 'Physiological Sigh' },
        '4-7-8-0': { inhale: 4, hold1: 7, exhale: 8, hold2: 0, label: 'Sleep/Calm' }
      };
      
      const phases = {
        inhale: { label: 'Breathe In', scale: 1, scaleEnd: 1.8 },
        holdIn: { label: 'Hold', scale: 1.8, scaleEnd: 1.8 },
        exhale: { label: 'Breathe Out', scale: 1.8, scaleEnd: 1 },
        holdOut: { label: 'Hold', scale: 1, scaleEnd: 1 }
      };

      // Pattern buttons
      patternBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          patternBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedPattern = btn.dataset.pattern;
          // Reset start time to restart from inhale phase
          if (isBreathing) {
            startTime = performance.now();
          }
        });
      });

      function getDurations() {
        const pattern = patterns[selectedPattern];
        return {
          inhale: pattern.inhale * 1000,
          hold1: pattern.hold1 * 1000,
          exhale: pattern.exhale * 1000,
          hold2: pattern.hold2 * 1000
        };
      }

      function easeInOutSine(t) {
        return -(Math.cos(Math.PI * t) - 1) / 2;
      }

      function animate(timestamp) {
        if (!isBreathing) return;

        const durations = getDurations();
        const totalCycle = durations.inhale + durations.hold1 + durations.exhale + durations.hold2;
        const cycleTime = (timestamp - startTime) % totalCycle;

        let phase, duration, elapsed, phaseConfig;

        if (cycleTime < durations.inhale) {
          phase = 'inhale';
          duration = durations.inhale;
          elapsed = cycleTime;
          phaseConfig = phases.inhale;
        } else if (cycleTime < durations.inhale + durations.hold1) {
          phase = 'holdIn';
          duration = durations.hold1;
          elapsed = cycleTime - durations.inhale;
          phaseConfig = phases.holdIn;
        } else if (cycleTime < durations.inhale + durations.hold1 + durations.exhale) {
          phase = 'exhale';
          duration = durations.exhale;
          elapsed = cycleTime - durations.inhale - durations.hold1;
          phaseConfig = phases.exhale;
        } else {
          phase = 'holdOut';
          duration = durations.hold2;
          elapsed = cycleTime - durations.inhale - durations.hold1 - durations.exhale;
          phaseConfig = phases.holdOut;
        }

        if (phase !== currentPhase) {
          currentPhase = phase;
          breathingText.textContent = phaseConfig.label;
        }

        const progress = duration > 0 ? elapsed / duration : 0;
        const easedProgress = easeInOutSine(progress);

        const scale = phaseConfig.scale + (phaseConfig.scaleEnd - phaseConfig.scale) * easedProgress;

        breathingBarrel.style.transform = `translate(-50%, -50%) scale(${scale})`;
        breathingBarrel.style.opacity = 0.7 + (0.3 * (scale - 1) / 0.8);
        breathingBarrel.style.boxShadow = `0 0 ${30 + (scale - 1) * 50}px rgba(167, 139, 250, ${0.4 + (scale - 1) * 0.4})`;

        animationFrame = requestAnimationFrame(animate);
      }

      function updateTimer() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerText.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.style.display = 'none';
        }
      }

      function startTimer() {
        timeLeft = 10 * 60; // Reset to 10 minutes
        timerDisplay.classList.add('visible');
        updateTimer();
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimer();
          
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
        }
        timerDisplay.classList.remove('visible');
      }

      function start() {
        isBreathing = true;
        startBtn.textContent = 'Stop';
        startTime = performance.now();
        animationFrame = requestAnimationFrame(animate);
        startTimer();
      }

      function stop() {
        isBreathing = false;
        startBtn.textContent = 'Start Breathing';
        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
        }
        breathingBarrel.style.transform = 'translate(-50%, -50%) scale(1)';
        breathingBarrel.style.opacity = '0.7';
        breathingBarrel.style.boxShadow = '0 0 30px rgba(167, 139, 250, 0.4)';
        breathingText.textContent = 'Ready';
        currentPhase = '';
        stopTimer();
      }

      startBtn.addEventListener('click', () => {
        if (isBreathing) {
          stop();
        } else {
          start();
        }
      });

      // Initial position
      breathingBarrel.style.transform = 'translate(-50%, -50%) scale(1)';
      breathingBarrel.style.opacity = '0.7';
      breathingBarrel.style.boxShadow = '0 0 30px rgba(167, 139, 250, 0.4)';
    </script>
  </body>
