<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="10 Minutes of Nothing - A pause ritual: open and don't touch anything for 10 minutes." />
    <meta name="theme-color" content="#000000" />
    <title>10 Minutes of Nothing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #000000;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        line-height: 1.6;
      }
      
      .container {
        max-width: 600px;
        width: 100%;
      }
      
      h1 {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 300;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }
      
      .subtitle {
        font-size: clamp(1.1rem, 4vw, 1.4rem);
        font-weight: 400;
        margin-bottom: 3rem;
        opacity: 0.8;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .cta-buttons {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 3rem;
      }
      
      .btn {
        display: inline-block;
        padding: 1rem 2rem;
        border: 2px solid #ffffff;
        background: transparent;
        color: #ffffff;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 500;
        border-radius: 8px;
        transition: all 0.3s ease;
        cursor: pointer;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .btn:hover {
        background: #ffffff;
        color: #000000;
        transform: translateY(-2px);
      }
      
      .btn-primary {
        background: #ffffff;
        color: #000000;
        font-size: 1.2rem;
        padding: 1.2rem 2rem;
      }
      
      .btn-primary:hover {
        background: #f0f0f0;
        transform: translateY(-2px);
      }
      
      .contact {
        margin-bottom: 2rem;
      }
      
      .contact a {
        color: #ffffff;
        text-decoration: none;
        opacity: 0.7;
        transition: opacity 0.3s ease;
      }
      
      .contact a:hover {
        opacity: 1;
      }
      
      .footer {
        margin-top: auto;
        padding-top: 2rem;
        border-top: 1px solid #333;
        width: 100%;
        max-width: 500px;
      }
      
      .footer-links {
        display: flex;
        justify-content: center;
        gap: 2rem;
        flex-wrap: wrap;
      }
      
      .footer-links a {
        color: #666;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s ease;
      }
      
      .footer-links a:hover {
        color: #ffffff;
      }
      
      @media (max-width: 480px) {
        body {
          padding: 1rem;
        }
        
        .cta-buttons {
          margin-bottom: 2rem;
        }
        
        .footer-links {
          gap: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>10 Minutes of Nothing</h1>
      <p class="subtitle">Open → Put down → Don't touch for 10 minutes. Everything else can wait.</p>
      <p class="subtitle" style="font-size: 1rem; margin-top: 1rem; opacity: 0.7;">Choose your focus mode: hidden screen, ghost timer, or breathing dot with guided 6-breaths-per-minute rhythm.</p>
      
      <div class="cta-buttons">
        <a href="/app" class="btn btn-primary">Launch App</a>
        <a href="/focus-lock/index.html" class="btn">How to Lock Screen</a>
      </div>
      
      <div class="contact">
        <a href="mailto:contact@nothing10.com">Email Us</a>
      </div>
      
      <footer class="footer">
        <div class="footer-links">
          <a href="/legal/privacy.html">Privacy Policy</a>
          <a href="/legal/terms.html">Terms of Service</a>
        </div>
      </footer>
    </div>
  </body>
</html>
